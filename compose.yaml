services:
  irmscher-tracker:
    build: .
    image: irmscher-tracker:latest
    container_name: irmscher-tracker
    init: true
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    env_file:
      - .env
    environment:
      TRACKER_DATABASE_URL: sqlite+aiosqlite:////app/data/tracker.db
      TRACKER_CONFIG_DIRECTORY: /app/config
      HF_HOME: /app/data/models/huggingface
    stop_grace_period: 30s
