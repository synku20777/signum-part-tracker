name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      TRACKER_API_TOKEN: ci-only-token-ci-only-token-ci-only-token
      TRACKER_DATABASE_URL: sqlite+aiosqlite:///ci-tracker.db
      TRACKER_CONFIG_DIRECTORY: config
      TRACKER_SCAN_ON_STARTUP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: cp .env.example .env
      - run: docker compose config
      - run: docker build -t irmscher-tracker:ci .
