[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "irmscher-tracker"
version = "0.1.0"
description = "Irmscher Parts Tracker for Opel Signum"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "defusedxml>=0.7.1",
    "cryptography>=43.0",
    "pillow>=11.0",
    "tzdata>=2025.2",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
tracker = "irmscher_tracker.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/irmscher_tracker"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.mypy]
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
